version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rmatss-postgres
    environment:
      POSTGRES_DB: rmatss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with other project
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma
    container_name: rmatss-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  clamd:
    image: clamav/clamav:latest
    container_name: rmatss-clamd
    ports:
      - "3310:3310"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmatss-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=rmatss_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CHROMA_HOST=http://chroma:8000
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL}
      - CLAMAV_ENABLED=true
      - CLAMD_HOST=clamd
      - CLAMD_PORT=3310
      - CLAMD_TIMEOUT_MS=60000
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
      clamd:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./uploads:/app/server/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: rmatss-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: rmatss-adminer
    ports:
      - "8085:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:

