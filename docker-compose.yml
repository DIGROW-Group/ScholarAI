version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: rmatss-postgres
    environment:
      POSTGRES_DB: rmatss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with other project
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma
    container_name: rmatss-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmatss-backend
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=rmatss_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CHROMA_HOST=http://chroma:8000
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./uploads:/app/server/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: rmatss-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:

